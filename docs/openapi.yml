      type: object
      required:
      - name
      - versions
      properties:
        name:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/DocsVersionEntry"
    DocsVersionEntry:
      type: object
      required:
      - name
      - version
      - fileCount
      - totalBytes
      - publishedAt
      properties:
        name:
          type: string
        version:
          type: string
        fileCount:
          type: integer
          format: int32
        totalBytes:
          type: integer
          format: int64
        publishedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    DocsVersionDetail:
      type: object
      required:
      - name
      - version
      - fileCount
      - totalBytes
      - publishedAt
      - files
      properties:
