# Artifacts config defaults, shipped from this library jar (docs/epics/qits-artifacts/). Library
# jars ship defaults as META-INF/microprofile-config.properties (ordinal 100) — a jar's
# application.properties is ignored — read by whichever app pulls the jar in (the `auth/*` modules
# ship their config the same way). The consuming app / env overrides any of these.
#
# Artifacts owns its OWN named datasource + persistence unit + Flyway lineage: its own PostgreSQL
# database, never sharing another service's. Metadata rows AND blob bytes are in it — the blob store
# moved to chunked bytea rows, so this datasource is the whole store rather than half of it.
#
# WHERE THE DATABASE COMES FROM. qits-platform-deployments creates the role and the database on the
# tier's postgres before the successor container starts, and injects the platform's generic resource
# contract — QITS_RESOURCE_DB_URL / _USERNAME / _PASSWORD — into it. Nothing about those names is
# artifacts-specific, which is the point: the application maps them in its own config and the
# deployer stays framework-agnostic.
#
# THE TRIPLE HAS NO DEFAULTS, AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming the missing
# variable rather than opening some fallback store nobody meant. The H2 file this used to default to
# was exactly such a fallback: a container that came up healthy on an ephemeral copy is the failure
# that hides.
quarkus.datasource.artifacts.db-kind=postgresql
quarkus.datasource.artifacts.jdbc.url=${QITS_RESOURCE_DB_URL}
quarkus.datasource.artifacts.username=${QITS_RESOURCE_DB_USERNAME}
quarkus.datasource.artifacts.password=${QITS_RESOURCE_DB_PASSWORD}

# THREE LINES, AND ALL THREE OR NONE — the platform's datasource baseline, carried by every postgres
# datasource on the platform. Replacing the tier's postgres severs every pooled connection; without
# validation the pool hands a dead one to the next caller long after the database is back, and 5s of
# acquisition is not enough for the successor to take the alias. Validate at borrow, and wait 15s
# before giving up.
#
# The driver line is the one that makes a request WAIT instead of fail: PatientPgDriver delegates to
# org.postgresql.Driver and, when the database is not there, keeps asking for up to 14s — under the
# 15s below, so a caller that outlasts it gets the database's real refusal rather than a generic
# acquisition timeout. It retries only "not there" (SQLState 08*, and 57P03 while postgres is
# starting up); a wrong password fails at once. It costs this service more than latency to skip: a
# failed catalog read that surfaces as "no such artifact" is cached by every docker, npm and maven
# client that asked.
quarkus.datasource.artifacts.jdbc.driver=eu.wohlben.qits.db.PatientPgDriver
quarkus.datasource.artifacts.jdbc.acquisition-timeout=15S
quarkus.datasource.artifacts.jdbc.validate-on-borrow=true

# The pool. Twenty because blob bytes travel through it now: a download holds a connection for the
# whole transfer where sendFile held none, so the pool sizes concurrent transfers rather than
# concurrent queries. NOTHING LONG-HOLDS A CONNECTION beyond that — every chunk read is its own
# short statement, promote is one transaction, and no request parks on a connection waiting for
# anything but its own bytes. The number tracks quarkus.vertx.worker-pool-size in the service
# module's application.properties, which is what bounds how many transfers can be in flight.
quarkus.datasource.artifacts.jdbc.max-size=20

# A dedicated persistence unit bound to the artifacts datasource, owning only this module's
# entities (the default PU keeps qits' domain entities). packages assigns entity→PU unambiguously,
# and it takes TWO packages now: the blob store's entities moved to eu.wohlben.qits.blobstore.entity
# when the store folded into the qits-registries reactor, while this module's own entities and the
# three format jars' keep eu.wohlben.qits.artifacts.entity. Drop either name and half the schema
# goes unmapped without a word.
quarkus.hibernate-orm.artifacts.datasource=artifacts
quarkus.hibernate-orm.artifacts.packages=eu.wohlben.qits.blobstore.entity,eu.wohlben.qits.artifacts.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with domain's db/migration.
# The location is named after the ENGINE as well as the context: the H2 chain that used to live at
# db/artifacts/migration is gone with the H2 driver, and a new directory rather than a rewritten one
# is what stops a deployment carrying an H2 schema history from half-applying this.
#
# baseline-on-migrate is deliberately absent, where the H2 chain carried it. Every database this
# lineage meets is either empty or was created by this lineage, so the flag would only mask the one
# case worth failing on — a schema somebody else put there.
quarkus.flyway.artifacts.migrate-at-start=true
quarkus.flyway.artifacts.locations=classpath:db/artifacts/postgresql

# Which datasource reaches the blob tables. This replaces qits.artifacts.blobs-dir: blob content is
# rows in `blob`/`blob_content`/`blob_chunk` now, which V1 of the lineage above creates from
# qits-blobstore's own db/blobstore-tables.sql. The store looks the datasource up by NAME, so this
# key and quarkus.datasource.artifacts.* have to name the same one.
qits.artifacts.blobs-datasource=artifacts

# How long a blob file must sit untouched before the sweep may unlink it — and, in the gc jar, how
# long a fresh IDENTITY is withheld whole. The window is the primitive's, not the report's.
#
# P7D until 2026-09-04, P2D until 2026-09-05, PT6H now — and with the access windows at P0D and the
# condemn stage gone (qits-1732) this is the ONLY clock left in the collector: a sweep deletes what
# its own plan finds dead on that run. Read it as race safety rather than as retention: the pin
# sources and the structural belts are the retention policy, and they name a coordinate the moment
# somebody else's row, manifest or configuration names it. What they cannot do is name it in the gap
# between a push and that row appearing — an image landing minutes before its deployment row, a
# library landing before the consumer's fold resolves it — and this window is exactly that gap, the
# push-to-pin gap the fail-closed keep-set cannot see. Six hours is the length of the gap, not the
# length of a retention.
#
# It gates IDENTITY ROWS as well as blob unlinks, and an identity is young when its OWN ROW STAMP is
# inside the window OR any of its blobs' stored_at is (qits-1732). The row half is not optional: the
# store dedupes and BlobStore.promote does not refresh stored_at, so a tag pushed onto an existing
# manifest or an unchanged docs version lands on old bytes and would otherwise be outside the window
# the moment it lands.
#
# What it does NOT close is the blob-exists-probe race for an OLD blob: a client's HEAD answers "have
# it" for a blob a concurrent sweep is about to unlink, and the manifest naming it lands after. That
# costs no data — the OCI manifest PUT then fails loudly with MANIFEST_BLOB_UNKNOWN and the client
# pushes the blob again — and npm and maven upload their content inline with no probe at all.
# Lower it further only with a reason; it is the cheap half of the safety.
qits.artifacts.gc.blob-grace-period=PT6H

# The GC pin sources moved to the gc jar's own META-INF/microprofile-config.properties, beside the
# code that reads them: qits.artifacts.gc.pins.cd-*, .ci-*, .maintenance-* and .configuration-*.
# Only the grace period stays here, because BlobStore is what enforces it.

# Self-seed the default repository rows at startup: the two CI types (ci-screenshots, ci-videos)
# plus the platform image repository (qits, type oci-images), without which the first docker push
# to a fresh deployment is 404 NAME_UNKNOWN. The gate lives in `service` (fires only when the web
# app boots, NORMAL/dev launch modes, never tests).
qits.artifacts.startup-seed.enabled=true
