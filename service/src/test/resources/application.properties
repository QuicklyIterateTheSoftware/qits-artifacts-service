# TEST-ONLY OVERRIDES. Nothing else belongs in this file.
#
# Quarkus MERGES src/main/resources/application.properties into the test config — it is not shadowed
# by this file. So every app-level setting (quarkus.application.name, quarkus.rest.path, the openapi
# settings, ...) is already in effect here, and must NOT be re-declared: a test copy that drifts from
# the shipped copy makes the suite pass on a value the packaged process never sees, and the suite
# then proves nothing about what ships. Only put a key here when the test genuinely needs a
# DIFFERENT value from the deployed one, and say why.
#
# The suite runs against a REAL POSTGRES — zonky binaries spawned as a child process, never a
# container. Its url, username and password are not written here at all: the port is chosen at run
# time, so testdb/EmbeddedPgConfigSource supplies the triple at ordinal 500, overriding the
# unresolvable QITS_RESOURCE_DB_* expressions the artifacts jar ships. Its database is this module's
# own (artifacts_svc_test), so the two library suites cannot wipe rows out from under it.
quarkus.flyway.artifacts.clean-at-start=true

# NO DEV SERVICES: a postgres datasource with no url is what invites a container start, and the
# config source always gives this one a url.
quarkus.devservices.enabled=false

# GC's six pin sources: qits-platform-deployments, qits-ci, qits-platform-maintenance,
# qits-configuration, qits-workspaces and qits-projects are other submodules, the suite has no
# network, and closed ports refuse at once instead of costing a DNS timeout on every plan request.
# The plan endpoint then answers non-executable with the pin-dependent types failed, and the sweep
# aborts whole — the behaviour GcPlanControllerTest asserts on the wire.
quarkus.http.test-port=0
qits.artifacts.gc.pins.cd-base-url=http://localhost:1/platform-deployments/api
qits.artifacts.gc.pins.ci-base-url=http://localhost:1/ci/api
qits.artifacts.gc.pins.maintenance-base-url=http://localhost:1/maintenance/api
qits.artifacts.gc.pins.configuration-base-url=http://localhost:1/configuration/api
qits.artifacts.gc.pins.workspaces-base-url=http://localhost:1/workspaces/api
qits.artifacts.gc.pins.projects-base-url=http://localhost:1/projects/api

# THE USERFLOWS CLASS ORDERER, INSTALLED THE ONE WAY QUARKUS PERMITS. quarkus-junit ships its own
# junit-platform.properties with a ClassOrderer that groups tests by @TestProfile (so a profile's
# application isn't torn down under a class still running), and surefire HARD-FAILS if a local
# junit-platform.properties overrides it. The blessed seam is the secondary orderer, which breaks
# ties INSIDE a profile group — story classes sharing a profile still run in topological
# @UserflowPrecondition order, and the ordinary test classes (no story annotations) are untouched.
# The framework's registries are per-JVM: keep the single sequential test JVM (surefire/failsafe
# default forkCount=1); do not enable parallel execution.
junit.quarkus.orderer.secondary-orderer=eu.wohlben.qits.userflows.UserflowClassOrderer

# The %test synthetic dev user (a header-less request) also holds qits:ci-run, because the CI media
# upload takes that role only and the in-JVM suites upload blobs without headers. Role tests never
# rely on it: they send an explicit forwarded pair or a MachineTokens bearer.
%test.qits.auth.forward.dev-roles=qits:admin,qits:system,qits-platform:system,qits:ci-run
