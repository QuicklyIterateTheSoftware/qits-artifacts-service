# THE QA PIPELINE — this repository's only pipeline, and it runs for RELEASE REQUESTS ALONE.
#
# It replaces ci-event-build.yml and ci-event-userflows.yml, both deleted in the commit that added
# this file. Per-push CI is retired platform-wide: nothing builds a branch any more, because nothing
# downstream wanted a per-push image — cd deploys what a RELEASE published, and the CalVer image
# comes out of ci-event-release.yml. What is left worth doing per change is the verify, and the only
# change worth verifying is one somebody is asking to release.
#
# qits-projects keeps, per open release request, a backing branch `release/<id>` — an octopus merge
# of the request's N sources, refolded whenever the set changes — and publishes
# `ReleaseRequestChanged` on every successful re-fold. That branch is written by qits-githost's merge
# primitive, which fires no post-receive and therefore publishes no `SCMPublishCommit`: without this
# event the fold exists and nothing builds it. The reference template with the full argument is
# qits-ci's docs/ci-event-release-request.yml.
#
# DECIDE AT MAIN, BUILD AT THE FOLD. The file is discovered, parsed and selected at this
# repository's `main` head, always; only the run's branch and sha come from the payload. So a
# release request cannot alter the CI that gates it by folding in a commit that edits this file.
#
# ONE FILE, TWO HALVES, and "a red verify must not cost the image" still holds — bought now with
# ORDERING plus PER-STEP CLASSIFICATION rather than with two files that cannot share a verdict. The
# gating half is FIRST, so whatever it produces is produced before a non-gating step can fail; the
# userflow half declares `gating: false`, which still fails the run and shows red but does not hold
# the fold for qits-projects' build gate. Keep the non-gating step LAST: a failing step skips
# everything after it, which is fine for a publish and wrong for a build.
#
# THE SHA IMAGE IS GONE. The old build step ended in `docker push
# $QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-artifacts:$QITS_CI_SHA`, the per-push coordinate cd
# keyed on. Nothing consumes it any more, and a fold's merged sha is not a coordinate anything could
# deploy. The image is still BUILT here — that is the real gate on this repository, whose Dockerfile
# is a GraalVM native build — and exported nowhere: the buildctl call below carries no `--output`,
# so the solve runs and the result is discarded.
#
# Loop review: this pipeline publishes a docs bundle, pushes no commit and no tag, and pushes no
# image, so it changes nothing the fold is made of and cannot re-trigger itself. Publish-if-absent:
# events redeliver and docs versions are immutable, so 409 is success.
event: ReleaseRequestChanged

when:
  # repoName, not repoId: the git host's storage coordinate is an opaque UUID since the identity
  # cutover, so a name match on repoId is not dependable. The event echoes the public name; a rename
  # updates this line in the same campaign. `suppressCi` is gone with the push event that carried
  # it — a release request is not a push and `-o qits.no-ci` has nothing to say about one.
  - repoName: { exact: qits-artifacts-service }

checkout:
  branch: backingBranch
  sha: mergedSha

steps:
  # --- the GATING half: build the fold ------------------------------------------------------------
  # ci-event-build.yml's step, minus the push. Its own rules, still binding:
  #
  # One step, two halves, and the split between them is the whole point:
  #
  #   1. build the artifacts client (service/src/main/webui = the qits-artifacts-frontend
  #      submodule) HERE, in the step container, which sits on qits-net and can therefore reach the
  #      platform's own npm registry — where @qits/ui-components lives. "And nowhere else can" is
  #      what this line used to say, and it was a fact about the HOST DAEMON: the platform builder's
  #      execs sit on qits-net too. The split stays anyway, because the Dockerfile's Quinoa commands
  #      are neutered to `--version` and the lockfile origin swap belongs to this step — moving the
  #      install into the image is a separate change with its own argument to make;
  #   2. build this repo's docker/Dockerfile, whose builder stage packages that already-built bundle
  #      and never runs an install.
  #
  # THE IMAGE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON — qits-buildkit-plan.md
  # in the wrapper is the whole migration, and qits-workspace-daemon's pipeline pair is the reference
  # recipe. `build: true` is what this step declares now: the same per-step, diff-visible opt-in
  # `docker: true` was, minus the root-equivalent socket the script no longer touches. It is what
  # gets the step $BUILDKIT_HOST (qits-containers) and the run's commissioned credential.
  #
  # THERE IS NO --network host ANY MORE AND NOTHING REPLACES IT. A `RUN` executes in the builder's
  # own namespace on qits-net, so Maven resolves qits-auth-core by the store's IN-NETWORK address
  # ($QITS_MAVEN_REGISTRY_URL) rather than by the host-published one the old host networking reached.
  # Still derived rather than spelled — no repository states a deployment's addresses.
  #
  # The frontend builds in this step container, which sits on qits-net and reaches the npm registry
  # by that service alias; the step needs node, npm and git for half one and buildctl for half two,
  # both of which node-docker-base carries.
  # The same split, for the same reason, as every webui-carrying sibling's — they should keep
  # matching.
  #
  # --- the one thing no sibling has to think about: this repo IS that registry --------------------
  # $QITS_NPM_PROXY_URL and $QITS_NPM_REGISTRY_URL are
  # http://qits-platform-artifacts:8080/artifacts/npm/… — this service, on qits-net. So half one dials
  # the currently deployed qits-platform-artifacts, which is fine and stays fine: this run replaces
  # nothing. A release request's QA build publishes no image and triggers no deploy, so the
  # build-then-swap race the old pair had to reason about does not exist on this path at all.
  #
  # What it does mean is unchanged: a run here cannot be green while qits-platform-artifacts is down.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed and the run reports SUCCESS — a green verdict for a fold that does not build is
      # exactly what the release gate must never be told. -u is load-bearing too: an unset registry
      # variable must stop the step, not quietly resolve the @qits scope against npmjs.org, where
      # those packages do not exist and never will.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false spells
      # off as empty-never-absent). Either way this recipe fails HERE, naming the cause, rather than
      # falling back to a socket this step no longer holds at all.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"

      # $QITS_CI_BRANCH is release/<id> and $QITS_CI_SHA is the merged sha — the fold is already
      # checked out, so nothing here fetches or switches refs.
      #
      # The daemon's clone is `--depth 50` and does not recurse, so the qits-artifacts-frontend submodule
      # at service/src/main/webui arrives as an empty directory — and Quinoa fails the image build on
      # exactly that (`No package.json found in Web UI directory`). Initialising it here rather than
      # asking the daemon to clone differently keeps the submodule this repo's business: it is a
      # public GitHub repo needing no credentials, and one shallow fetch.
      #
      # THE REPOSITORY IS NAMED qits-artifacts-frontend since the phase-2 renames. It was
      # qits-spa-artifacts, and before that qits-platform-spa-artifacts. A git host serves the
      # current name only, so an old spelling here is a 404 on every run — measured 2026-08-12, on
      # the proving rebootstrap. The `-c` key is the .gitmodules ENTRY name, which is what
      # `submodule.<name>.url` is written under; the entry was renamed with the repository, so the
      # two agree.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-artifacts-frontend"
      git -c submodule.qits-artifacts-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      # THE LOCKFILE is the one file this step edits, and npm leaves no alternative. Same problem
      # and same fix as qits-artifacts-frontend's own pipeline — that repo's recipe is where this
      # pattern is maintained, and the two should keep matching.
      #
      # npm pins a full resolved URL per package, and qits-artifacts-frontend's lockfile is
      # generated on the deployment host, so every entry names a localhost port — an address that
      # does not exist in this container. `npm ci` fetches tarballs by that URL and never asks the
      # configured registry for them, so the environment below does not reach them: without this
      # swap the install dies on connection refused. The paths are identical on every address, so
      # replacing the ORIGIN and keeping the path is all it takes, and the integrity hashes are what
      # make that safe — bytes from the other address must still hash the same. The checkout is this
      # step's own; nothing is edited that anyone will ever read again.
      #
      # THE BYTE PLANE IS TWO SERVICES SINCE THE SPLIT, WHICH IS WHY THE SWAP READS THE PATH.
      # qits-platform-mirror holds the npmjs pull-through cache; qits-artifacts hosts the @qits
      # scope. No single origin serves both, so the path is what tells them apart: an entry under
      # the hosted registry's own pathname — $QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/ — is a
      # @qits tarball and gets the hosted origin, and every other entry gets the proxy's. One sed
      # covered both roots while they shared an origin; since the split it sends every @qits tarball
      # to the mirror, which has never held one: 404, on every run.
      #
      # THE ORDER OF THE TWO EXPRESSIONS IS THE WHOLE TRICK. sed applies -e in sequence per line, so
      # the broad proxy swap runs FIRST and the narrow path-anchored one corrects the @qits entries
      # after it. The other order lets the broad expression undo the narrow one.
      #
      # npm's own knob for exactly this, `--replace-registry-host=always`, cannot do it against a
      # registry mounted under a path, and could not have told two registries apart either.
      # @npmcli/arborist glues rather than resolves (reify.js:
      # `registry.slice(0, -1) + resolvedURL.pathname`), so
      # http://qits-platform-mirror:8080/artifacts/npm/npmjs/ + /artifacts/npm/npmjs/zone.js/-/…tgz
      # comes out as …/artifacts/npm/npmjs/artifacts/npm/npmjs/zone.js/-/…tgz and every tarball
      # 404s. Measured on npm 10.9.4.
      #
      # Every address is derived from the injected env rather than spelled here: no repository
      # states a deployment's addresses, and the two qits-artifacts-frontend does state
      # (registry.dev.localhost:8080 for the @qits scope and mirror.dev.localhost:8080 for npmjs, in
      # its .npmrc, for a developer on the host) are the ones being replaced.
      cd service/src/main/webui
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      # ENVIRONMENT, not a file. qits-artifacts-frontend COMMITS an .npmrc (registry.dev.localhost:8080
      # for @qits and mirror.dev.localhost:8080 for npmjs, right for a developer on the host), and
      # npm ranks a project .npmrc ABOVE ~/.npmrc — so a `cat > ~/.npmrc` preamble would be written
      # and silently ignored. `npm_config_*` environment outranks both files, so it wins without
      # touching the submodule's tree.
      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      # dist/qits-spa-artifacts/browser — the bundle the image build consumes (it is
      # quarkus.quinoa.build-dir in service/src/main/resources/application.properties), and the ONE
      # artifact this half exists to produce. Lint and test are qits-artifacts-frontend's own
      # pipeline's job; repeating them here would only make this repo red for someone else's commit.
      npm run build
      cd -

      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history. The launcher injects the run's commissioned idp client as
      # $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; it is written to files under
      # umask 077 OUTSIDE the clone (so neither can enter the build context) and handed to buildctl
      # as `src=`, which the Dockerfile's mvnw RUN mounts as bare files under /run/secrets. FILE form
      # on both sides: the `env=` mount form couples the recipe to whichever dockerfile frontend the
      # builder picks, and under the platform buildkitd that choice is not this repository's.
      umask 077
      printf '%s' "$QITS_COMMISSIONED_CLIENT_ID" > /tmp/qits-client-id
      printf '%s' "$QITS_COMMISSIONED_CLIENT_SECRET" > /tmp/qits-client-secret

      # NOTHING IS PUSHED, AND THAT IS STILL THE POINT OF THIS STEP.
      # `$QITS_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-artifacts:$QITS_CI_SHA` was the per-push
      # publication and it is retired with the push path; the CalVer coordinate is
      # ci-event-release.yml's. What remains is the build itself, which is what gates the fold: this
      # Dockerfile is a GraalVM native build and a fold that does not compile must not reach a
      # release. Under buildctl "build and keep nothing" is spelled by passing NO `--output` at all —
      # the solve runs, every layer lands in the shared builder cache, and no image is exported
      # anywhere. There is no local image store in the path any more, so the local tag this line used
      # to carry has nothing left to name and the old `docker rmi` question is gone with it.
      #
      # The two build-args and the two secrets are BYTE-IDENTICAL to ci-event-release.yml's, which is
      # what makes a release that follows a green fold a stack of cache hits in the same builder
      # rather than a second native compile. Keep them matched.
      #
      # $QITS_MAVEN_REGISTRY_URL, not the host-published address: the resolve happens inside the
      # builder's namespace on qits-net now. $QITS_MAVEN_PROXY_URL for the same reason — empty (an
      # older qits-ci, or the mirror plane turned off) deactivates the settings profile and Central
      # is resolved directly, exactly as before.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # --- the NON-GATING half: verify, and publish what the run observed -----------------------------
  # ci-event-userflows.yml's step, unchanged but for the settle-hold (see below) and `gating: false`,
  # which is the whole of what that separate file was. This step failing leaves the run FAILED and
  # visible, and leaves the fold's build gate untouched.
  #
  # `mvn verify` at the fold — which regenerates service/target/userstories/ through
  # TokenValidationBootstrapIT (the two `authentication` stories, on their own mock-idp profile) and
  # the 21 story classes under eu.wohlben.qits.stories: seven categories named after the seeded
  # repositories — npm, maven, daemons, docs, qits (the OCI registry), ci-screenshots, ci-videos —
  # each a chain of publish -> consume -> explore, the last link of every chain a headless-Chromium
  # flow over the embedded SPA. The reports are published as one docs bundle, site
  # @userflows/qits-artifacts, version = the merged sha, branch riding as artifacts metadata.
  #
  # ONE STEP, BECAUSE STEPS SHARE NOTHING. Every step container clones the repository for itself
  # (the ci-daemon's Workspace clones into the container's own /workspace), so a bundle built in one
  # step does not exist in the next — the verify and the publish must stay in one container, and the
  # gating step above cannot hand this one anything. That is also why the halves do not share the
  # build: they are two containers, not two phases.
  #
  # ON userflows-base, BECAUSE THE STEP NEEDS EVERYTHING AT ONCE: Maven + JDK, Chromium at
  # PLAYWRIGHT_BROWSERS_PATH for the seven browser stories, skopeo for the `qits` category, and the
  # step-image contract (passwd user, /workspace 1777 — since qits-oci 2026.828.162434, this image
  # carries it). Node is deliberately NOT assumed: Quinoa's managed install fetches its own node (the
  # pinned 22.22.0, the same version docker/Dockerfile pins) and runs the REAL npm ci + build with
  # it — the registry redirection rides in as npm_config_* environment, which outranks the
  # submodule's committed .npmrc.
  #
  # SKOPEO IS LOAD-BEARING, AND ITS ABSENCE LOOKS EXACTLY LIKE A PASS. The `qits` category's three
  # stories are gated `@EnabledIf(Cli#skopeoPresent)` at class level — a missing image client is a
  # SKIP, because a story that aborts mid-body publishes a red report for a machine's inventory
  # rather than for the product. So an image without skopeo runs this step green while silently
  # emitting no OCI chapter at all: the bundle would be three stories short and nothing in the log
  # would say so. userflows-base carries skopeo as of qits/build-images/userflows-base
  # 2026.829.153130; treat that as a requirement of this step and not as a convenience, and if the
  # published bundle ever loses its `qits` category, look at the image before looking at the code.
  #
  # THE MAVEN STORIES DIAL CENTRAL, WHICH IS A DEPENDENCY OF THIS STEP. MavenDeployIT and
  # MavenResolveIT fork ${maven.home}/bin/mvn as a real child process — what a release pipeline
  # actually types — and those forks resolve maven-deploy-plugin:3.1.4 and maven-dependency-plugin
  # :3.8.1 (~2 MB with their transitive plugin dependencies) into the surrounding build's local
  # repository. In this container ~/.m2 is cold on every run, so both are fetched every time. The
  # outer build's .qits-maven-settings.xml routes `central` through the platform mirror whenever
  # QITS_MAVEN_CENTRAL_URL is non-empty — this step exports it from the injected
  # QITS_MAVEN_PROXY_URL, and the forks inherit the environment and those settings without an -s of
  # their own — and dials repo1.maven.org directly otherwise. A container with no route to whichever
  # central source is active fails the maven category outright — this is not a skip, because mvn
  # itself is present.
  #
  # THE STORIES' OWN TOOLS ARE NOT THE STEP'S. eu.wohlben.qits.stories.support.Cli resolves each
  # program once per JVM — the -D override the pom fills (${maven.home}/bin/mvn, the .quinoa/node
  # directory Quinoa unpacked), then PATH — and hands the resolved path to Commands.run as a {}
  # ARGUMENT so the recorded fingerprint keeps the template. That is deliberately NOT the npm_config_*
  # environment this script exports: those exist for Quinoa's own `npm ci`, while a story publishing
  # to the launched process passes --registry= and --@qits:registry= on its command line, which
  # outrank the environment and defeat the workspace npm shim. Do not "unify" the two.
  #
  # `user: pwuser`, and NOT a switch inside the script: the suite starts zonky's embedded postgres,
  # initdb refuses to run as root and calls getpwuid, so the step needs a passwd-backed non-root
  # user — pwuser is the one the Playwright image bakes (and userflows-base now guarantees).
  #
  # THE SETTLE-HOLD IS GONE. This step used to open with `sleep 120`, because the gating run's
  # BuildSuccessful made qits-cd swap the very container that serves the maven jars, the npm
  # tarballs and the docs PUT — measured 2026-08-28, twice. No QA run deploys anything now: the
  # image above is never pushed and a green run is a verdict rather than a release, so there is no
  # swap to wait out. The deployed qits-artifacts this step dials is simply whatever is running.
  - image: qits/build-images/userflows-base:latest
    user: pwuser
    gating: false
    # 23 stories: seven Chromium-plus-video explore runs, two skopeo copies, an npm publish and
    # install, two forked maven JVMs pulling their plugins from central on a cold ~/.m2, and the
    # whole unit suite plus the SPA build in front of all of it.
    timeout-seconds: 3600
    script: |
      set -eu

      # The submodule fetch under the .gitmodules entry name, and the lockfile origin swap
      # (broad proxy sed FIRST, narrow @qits sed SECOND) — the gating step above carries the long
      # form of every rule here, and the two should keep matching. Origins are derived with sed
      # rather than node -p: this image deliberately carries no node of its own.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-artifacts-frontend"
      git -c submodule.qits-artifacts-frontend.url="$frontend_url" submodule update --init service/src/main/webui
      npm_hosted_origin=$(echo "$QITS_NPM_REGISTRY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      npm_proxy_origin=$(echo "$QITS_NPM_PROXY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
      npm_hosted_path=$(echo "$QITS_NPM_REGISTRY_URL" | sed -E 's#^https?://[^/]+##')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        service/src/main/webui/package-lock.json

      # The registry redirection for the npm Quinoa is about to run: npm_config_* environment
      # outranks the submodule's committed .npmrc, and Quinoa's child processes inherit it.
      export npm_config_registry="$QITS_NPM_PROXY_URL"
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"

      # The platform maven registry exactly as qits-eventstream's step derives it, plus Quinoa's
      # MANAGED node: this image carries none, so the extension downloads its pinned 22.22.0 and
      # runs the real install + build with it. quinoa.ci=true pins `npm ci` regardless of the
      # container's CI envs. The scoped-registry variable needs the env wrapper — `@` and `:` are
      # not assignable in a shell prefix.
      env "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa.package-manager-install=true \
        -Dquarkus.quinoa.package-manager-install.node-version=22.22.0 \
        -Dquarkus.quinoa.ci=true

      # `-C … .` so the story directories are the bundle's roots — nesting one directory deep would
      # put it in every served URL.
      tar -czf userstories.tgz -C service/target/userstories .

      # Branch and commit ride as metadata (the docs store's exact-match discovery keys); the
      # version is the merged sha itself, so a bundle URL never changes meaning.
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @userstories.tgz \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-artifacts" \
        "$QITS_DOCS_URL/@userflows/qits-artifacts/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-artifacts@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-artifacts@$QITS_CI_SHA already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
