# The application config for qits-artifacts as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to META-INF/microprofile-config.properties at ordinal 100, which is how a library ships
# DEFAULTS it does not own the deployment of. The library jars ship theirs there: qits-blobstore the
# blob directory and the grace period, qits-registries-{npm,maven,oci} each format's caps and TTLs,
# qits-auth-core the forwardauth contract. Anything restated here is restated because THIS service
# owns the decision.

quarkus.application.name=qits-artifacts

# The JAX-RS prefix. qits-gateway routes VERBATIM by prefix — /artifacts/* reaches this service with
# nothing rewritten — so the service itself has to serve the segment, and there is no unprefixed
# form. That holds for service-to-service calls on qits-net too, which never see the gateway.
#
# It governs /artifacts/api/** — but NOT the wire protocols: npm, maven, the docs and daemon wires
# all register plain Vert.x routes whose prefixes are LITERALS in their own classes, outside the
# JAX-RS base and unaffected by this. Both surfaces are verified against the packaged process, not
# just the suite, because they resolve through different machinery and only one of them moves when
# this value changes.
quarkus.rest.path=/artifacts/api

# Quarkus' non-application root — the framework's own surface (the OpenAPI document, swagger-ui,
# health) rather than application code. It sits OUTSIDE quarkus.rest.path and moves only with this
# key, so anything left at the root /q would be unreachable through the prefix-routing gateway.
# quarkus.swagger-ui.path is relative by default and follows automatically; do not pin it.
quarkus.http.non-application-root-path=/artifacts/q

# READINESS DEPENDS ON POSTGRES, AND THAT IS A DEPARTURE TAKEN ON PURPOSE. The platform's standing
# stance is that a readiness probe must not fail because some other service is down — a probe that
# reports somebody else's outage turns one incident into a cascade of restarts. Agroal's datasource
# check is the exception, and it is spelled out here rather than left to a default so that turning it
# off would be a diff rather than a silence.
#
# The reason is that postgres is not an external dependency of this service, it IS the store. Metadata
# rows and blob bytes are both in it, so a process that cannot reach it can serve nothing: every pull
# is a 500 and every push is a 500. Reporting READY in that state is worse than reporting NOT READY,
# because the deployer's health gate is what decides whether a successor takes the network alias — a
# ready-but-storeless container would be cut over onto, and the registry every build and every deploy
# pulls from would be swapped for one that answers nothing.
quarkus.datasource.health.enabled=true

# --- the web UI -----------------------------------------------------------------------------------
# Quinoa builds src/main/webui (the qits-spa-artifacts submodule, an Angular SPA) during
# augmentation and serves the output as static resources. Every surface is on the same port: the
# SPA is what this service's own host serves at /, /artifacts/api is JAX-RS, /artifacts/q is
# Quarkus' own, and the wire stacks keep their literal prefixes.
#
# ui-root-path is the ROOT, because this service has a host of its own — registry.<env>.<domain>,
# the name docker already resolves an image reference against. The client's baseHref in the
# submodule's angular.json is "/" to match: Quinoa mounts the files, the baseHref is what makes
# index.html ask for them at the right url, and a mismatch serves a page whose every asset 404s.
quarkus.quinoa.ui-root-path=/

# Deep links: /repositories/<repo>/images/<image> and every scoped spelling of it has no file
# behind it, so without this a reload or a pasted link 404s and only the entry page works.
quarkus.quinoa.enable-spa-routing=true

# Angular's output. Quinoa detects Angular from `ng serve` in package.json and derives the same
# dist/<project>/browser from angular.json, but it is derived from a project NAME — pinning it means
# a rename in angular.json fails this build rather than resolving somewhere stale.
#
# This is the SPA's own angular.json project key, not the repository name. Both say
# qits-spa-artifacts since the 2026-08-13 rename; moving it again takes a change in the SPA's
# angular.json and this line, together — the webui gitlink and this value must agree.
quarkus.quinoa.build-dir=dist/qits-spa-artifacts/browser

# What SPA routing must NOT swallow. The re-route is a catch-all at the ui root — late-order, so
# anything with a real route in front of it still wins, but a request that matches no route is
# rerouted to index.html and answers 200 HTML instead of 404.
#
# Values are matched AFTER ui-root-path is stripped, and the ui root is `/`, so they are ABSOLUTE
# now. Setting the key REPLACES Quinoa's derivation (which would give /artifacts/api and
# /artifacts/q) rather than adding to it, so both halves are spelled by hand.
#
# TWO ENTRIES COVER EVERY MACHINE SURFACE, because the match is by prefix:
#
#   /artifacts  JAX-RS (quarkus.rest.path), the framework root (non-application-root-path), and the
#         four raw Vert.x wire stacks that live under the segment as literals in their own classes —
#         /artifacts/npm (NpmRoutes), /artifacts/maven (MavenRoutes), /artifacts/daemons
#         (DaemonRoutes) and /artifacts/docs (DocsRoutes). No config key names any of the four, and
#         each has a client that would be ruined by a page: npm parses index.html as JSON, maven
#         reports a corrupt jar, a bootstrap script execs a web page, and qits-docs renders one in
#         place of a stylesheet.
#
#   /v2   the OCI Distribution API, at the HOST ROOT because docker and podman resolve an image
#         reference against <host>/v2/ and accept no prefix. It is INSIDE the ui root now, which is
#         what makes this entry load-bearing rather than a belt: served the SPA, a registry client
#         gets 200 text/html with no Docker-Distribution-Api-Version header and reports something
#         that names neither the cause nor the fix. PackagedProcessIT asserts both directions.
quarkus.quinoa.ignored-path-prefixes=/artifacts,/v2

# gzip on the way out. The SPA bundle is 206 kB uncompressed and about 60 kB gzipped, and the
# explorer's JSON compresses harder than that again — a repository listing is mostly repeated key
# names.
#
# It has to be HERE and not in a deployment's environment: the key is BUILD_AND_RUN_TIME_FIXED, so
# an env var on the container is read, accepted and ignored, with no warning anywhere. The value
# that ships is the value that runs.
#
# quarkus.http.compress-media-types is deliberately LEFT UNSET. Setting it REPLACES Quarkus' default
# list rather than adding to it, so naming one type would silently stop compressing the other seven
# — and the default list is already what we want: text/*, application/json, application/javascript
# and the XML family, none of which is an image layer, a tarball or a git packfile. Those are
# already-compressed bytes served with sendFile, and re-compressing them would cost CPU to grow
# them.
quarkus.http.enable-compression=true

# --- the type registration, narrowed to what this service hosts ---------------------------------
# THE ONE LINE THAT KEEPS THIS SERVICE OFF THE CACHE PLANE.
#
# Each qits-registries module carries BOTH sides of its format — hosted and pull-through cache —
# because they share a table and a set of routes and are told apart by the repository row's type. So
# the CACHE profile beans arrive on the classpath whether this service wants them or not, and a
# registered profile is a type a repository row may legally carry.
#
# Excluding them from bean discovery is what makes "the caches are qits-platform-mirror's" true
# rather than merely intended: RepositoryTypeProfiles then indexes exactly the seven hosted keys,
# ArtifactRepositoryService.ensure answers a request for a cache type with a 400 naming what IS
# registered, and the GC plan reports the seven this service can actually collect instead of three
# lines about engines that are not here.
#
# Nothing injects these beans (every reference in the libraries is to their static KEY constant), so
# removing them costs no wiring. The mirror ships the mirror image of this line.
quarkus.arc.exclude-types=eu.wohlben.qits.artifacts.control.NpmProxyProfile,eu.wohlben.qits.artifacts.control.MavenProxyProfile,eu.wohlben.qits.artifacts.control.OciMirrorProfile

# --- the API document -------------------------------------------------------------------------
# Served at /artifacts/q/openapi, with the browsable UI at /artifacts/q/swagger-ui — both under
# non-application-root-path above, not quarkus.rest.path. always-include because swagger-ui is a
# dev-mode-only extension by default, and the point of packaging these as processes is that each
# documents its own surface in a real deployment.
#
# The wire routes (npm, maven, /v2, docs, daemons) are Vert.x, not JAX-RS, so they appear in no
# document. That is not an omission to fix: a wire protocol has a client, not a caller.
quarkus.smallrye-openapi.info-title=qits-artifacts API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# One key, and it is deliberately NOT pinned here:
#
#   qits.auth.machine.required
#                         Off means the JSON admin write surface is unauthenticated — network trust,
#                         the posture this service shipped with. A deployment that has
#                         qits-platform-idp turns it on. See the machine-token block near the end
#                         of this file.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-artifacts` rather than qits-artifacts-service-<version>-runner, so
# `-Dnative` produces target/qits-artifacts and the process is identifiable in `ps` / `docker top`.
# The failsafe plugin's native.image.path in service/pom.xml spells the same name; they move
# together.
quarkus.package.output-name=qits-artifacts
quarkus.package.jar.add-runner-suffix=false

# quarkus.native.additional-build-args is GONE with the git host. Every flag it carried was a JGit
# static that native-image refuses to freeze into the image heap, and JGit left for qits-githost
# with the smart-HTTP host; that repo carries the flags now. Nothing on this classpath needs one.

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path, the same
# shape as qits.projects.url. The ingest path is qits-observability's own and belongs to the
# service, not to the deployment, so it is spelled once here and derived rather than configured.
# Point this at a collector or a different host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# The bridge itself is proven in qits-events, whose OtelLogBridgeTest decodes a real
# ExportLogsServiceRequest and whose PackagedLogBridgeIT repeats it against the packaged artifact.
# The extension and this configuration are the same here, so this repo carries no second copy of
# that proof — only OtelLogConfigTest, which pins these four keys and the exporter they ride.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true

# --- machine tokens from qits-platform-idp (qits-idp-plan.md phase 1) -----------------------------
# Two tracks of identity meet here. USERS keep arriving as qits-gateway's X-Qits-User header, read by
# qits-auth-core's ForwardAuthMechanism — unchanged, and untouched by anything below. MACHINES arrive
# with a bearer token minted by qits-platform-idp; quarkus-oidc validates it and MachineAuth
# decides what it permits.
#
# This service's own id, which is the `aud` its tokens must carry. `require()` in a guard therefore
# already means "a token minted for me" and never one meant for qits-ci.
qits.auth.machine.audience=qits-platform-artifacts

# THE ROLLOUT GATE, and the one switch a deployment flips. Off (the shipped default, from
# qits-auth-core) every MachineAuth.require* call returns at once and every guarded endpoint behaves
# exactly as it did before qits-platform-idp existed — network trust, no bearer needed. On, the
# same call demands a validated token addressed to qits-platform-artifacts.
#   QITS_AUTH_MACHINE_REQUIRED=true
#
# The OIDC tenant follows the gate rather than being enabled on its own. That is what lets this
# service ship its enforcement code first: with the gate off there is no tenant, so nothing fetches a
# JWKS, nothing waits on a host named qits-platform-idp, and a clone-alone `./mvnw verify` needs no
# issuer at all. There is no third state — either the gate and the validation are both on, or both
# off.
quarkus.oidc.tenant-enabled=${qits.auth.machine.required:false}

# Authenticate lazily, when a guarded JSON endpoint asks for SecurityIdentity. The raw OCI, npm,
# and Maven routes deliberately use qits-net trust; npm nevertheless sends its mandatory dummy
# _authToken on publish. Proactive auth would parse that ceremony as an OIDC bearer and reject the
# request before the tokenless Vert.x route can see it. MachineAuth-backed endpoints still trigger
# normal bearer validation because their request path resolves SecurityIdentity.
quarkus.http.auth.proactive=false

# Bearer-only. This service starts no login flow and holds no session; a request with no
# Authorization header is not challenged, it falls through to forward-auth and stays user traffic.
quarkus.oidc.application-type=service

# Reached DIRECT on qits-net, never through the gateway. Discovery is off because the fetch is
# internal while the issuer string is a public URL, so the JWKS path is given rather than looked up;
# it is joined onto auth-server-url, which is why it reads `jwks` and not `/idp/jwks`. Set
# quarkus.oidc.token.issuer as well the day the two diverge.
quarkus.oidc.auth-server-url=http://qits-platform-idp:8080/idp
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=jwks

# Belt and braces with MachineAuth's own audience check: a token minted for another service is
# rejected as invalid here, before any guard runs.
# The second value is the platform audience that a person's `qits` CLI token carries. Such a
# token gets in here too; its roles, not its audience, decide what it may do.
quarkus.oidc.token.audience=${qits.auth.machine.audience},qits-platform

# Retry the boot-time JWKS fetch rather than falling straight back to lazy. Without this there is
# ONE attempt: it fails to a WARN ("an attempt to connect will be made during the first request"),
# and the first request carrying a bearer pays for it — a 500 if the issuer is still unreachable.
# On a cold boot this service races idp's own start. 30S is fifteen tries, two seconds apart, which
# covers idp coming up beside it in the same compose.
#
# NOT a hard dependency: when the window expires the same WARN is logged and startup continues,
# which matters here because the raw OCI, npm and Maven routes run on qits-net trust and must
# keep serving whatever the token plane is doing. Readiness deliberately stays independent of the
# issuer for the same reason — quarkus.oidc.health.enabled is BUILD_TIME and cannot follow the
# runtime gate, so enabling it would take the registry down with the idp.
# TokenValidationBootstrapIT is what pins the startup fetch, against a recording mock idp.
quarkus.oidc.connection-delay=30S

# How fast a ROTATED idp key is picked up. The idp persists its signing key in its own database, so
# a redeploy keeps it — a rotation is an operator retiring a key, or an idp landing on an empty
# database. Until it is picked up every validator holds the OLD key set: an unknown `kid` forces ONE
# JWKS refresh, and the default 10M is the minimum before the next, so a refresh that lands while
# idp is down costs ten minutes of 401s. PT5S ends that seconds after idp answers again, for at most
# one JWKS fetch per five seconds on the platform's own network.
quarkus.oidc.token.forced-jwk-refresh-interval=PT5S

# The quarkus.oidc-client.* block is GONE, and so is the extension. Its only user was the git host's
# post-receive notifier, which needed a bearer with aud=qits-ci to reach that intake — and both the
# notifier and the host are qits-githost's now, where the events are durable rather than an HTTP
# call. This service makes no outbound call to a guarded endpoint at all, so a token it could present
# would be a credential nothing uses.

# --- long uploads on a worker thread -------------------------------------------------------------
# Vert.x' BlockedThreadChecker logs a warning WITH A FULL STACK TRACE whenever an executeBlocking
# task outruns quarkus.vertx.max-worker-execute-time, which defaults to 60 seconds. It aborts
# nothing — but the registry's blob PATCH holds its worker for as long as the client is sending, and
# a 1 GB layer is minutes on any link worth calling slow, so the default turns every large
# `docker push` into a wall of stack traces that buries real warnings.
#
# ISO-8601 rather than a bare number, which Quarkus reads as seconds. This also raises the threshold
# for the docs bundle upload, which is the same shape of work (a large body held on a worker while
# its entries are unpacked into the store) and wants the same answer.
#
# What bounds a stalled client instead is qits.artifacts.oci.upload-idle-timeout — a per-chunk wait,
# so a client that has stopped sending is dropped in a minute while a slow but progressing one runs
# to completion.
quarkus.vertx.max-worker-execute-time=PT30M

# WORKERS ARE NOW WHAT BOUNDS CONCURRENT DOWNLOADS, and the default of 20 was sized for a service
# where they were not. Blobs live in postgres, so serving one pulls it chunk by chunk on the calling
# worker thread (qits-registries' BlobSender) — where sendFile handed a file region to Netty and
# released the thread at once. Every blob route is a blockingHandler, so a pull now costs a worker
# for the whole transfer.
#
# THE NAMED TRADE-OFF: the thread is held for the transfer, and one connection's PIPELINED requests
# serialize behind each other. That is the price of having no file to hand out, and it was taken
# deliberately rather than worked around — the alternatives are a second copy of the bytes on disk
# (two sources of truth for one blob) or an event-loop pump (which would still hold a connection out
# of a pool of the same size). 40 is double the default: it sits with
# quarkus.datasource.artifacts.jdbc.max-size=20 in the artifacts jar, so the pool is what queues a
# burst rather than the thread pool growing unboundedly against it.
quarkus.vertx.worker-pool-size=40
