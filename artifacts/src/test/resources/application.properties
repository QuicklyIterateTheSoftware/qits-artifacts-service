# Artifacts's own test suite: REAL postgres, no docker, no variant flag.
#
# Zonky binaries spawned as a child process — see testdb/EmbeddedPg for why a container is not an
# option here. The url, username and password are NOT written down: the instance takes a free port,
# so EmbeddedPgConfigSource supplies the triple at ordinal 500, overriding the unresolvable
# QITS_RESOURCE_DB_* expressions the artifacts jar's microprofile-config.properties carries.
#
# There is one datasource, not two. Blob bytes are rows in the same database as the metadata now, so
# the Flyway lineage builds the whole store and qits.artifacts.blobs-datasource=artifacts (shipped)
# points the blob store at this same connection.
quarkus.flyway.artifacts.clean-at-start=true

# NO DEV SERVICES. A postgres datasource with no url is exactly what invites a container start, and
# the config source above always gives this one a url — this line is what makes "should not" into
# "cannot".
quarkus.devservices.enabled=false

# Small chunks, so the suite's kilobyte fixtures cross chunk boundaries on both the write and the
# read path. Every read is arithmetic on the chunk size each blob records, so exercising it at 4 KiB
# exercises it at 1 MiB without moving megabytes to reach the second chunk.
qits.artifacts.blob-chunk-size=4096

# Port 8081 is the platform's own npm registry on the build hosts, so never bind a fixed test port —
# a @QuarkusTest that tried would fail with "Port already bound: 8081" against a service that has
# nothing to do with this build. The qits-registries and qits-platform-mirror suites carry the same
# line for the same reason.
quarkus.http.test-port=0

# None of the six pin peers exists in this repo, and the suite has no network. Closed ports are the
# honest posture rather than hostnames that cost a DNS timeout: a pin fetch is refused at once, so a
# plan reports itself non-executable and a sweep aborts whole. Strategy-level cases hand pins in
# directly and never reach these.
qits.artifacts.gc.pins.cd-base-url=http://localhost:1/deployments/api
qits.artifacts.gc.pins.ci-base-url=http://localhost:1/ci/api
qits.artifacts.gc.pins.maintenance-base-url=http://localhost:1/maintenance/api
qits.artifacts.gc.pins.configuration-base-url=http://localhost:1/configuration/api
qits.artifacts.gc.pins.workspaces-base-url=http://localhost:1/workspaces/api
qits.artifacts.gc.pins.projects-base-url=http://localhost:1/projects/api

# Only the hosted types are registered here, exactly as in the deployable's application.properties:
# the cache profiles arrive on the qits-registries jars and are vetoed, so ensure() refuses one and
# the seeded set is the whole registered set.
quarkus.arc.exclude-types=eu.wohlben.qits.artifacts.control.NpmProxyProfile,eu.wohlben.qits.artifacts.control.MavenProxyProfile,eu.wohlben.qits.artifacts.control.OciMirrorProfile
