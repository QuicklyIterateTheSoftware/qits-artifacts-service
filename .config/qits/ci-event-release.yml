# The release pipeline: this repository reacts to its OWN release and pushes the image under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT. `SCMRelease` says only
# "source control has this version" — qits-projects' Auto Release publishes it once the release
# request's gate is green and the tag is written, and nothing in this file publishes it. (It is
# `SCMRelease` and NOT `SCMPublishTag`: qits-githost's tag primitive fires no post-receive and
# announces nothing.) So a repository listening for its own SCMRelease
# is exactly the release pipeline the split-release design asks each repository to own: the SCM half
# fires, this half builds the tagged commit and pushes it, and qits-ci turns the green run into one
# `SoftwareRelease` per entry under `artifacts:` below. The event that could loop is
# SoftwareRelease, and this file neither listens for it nor publishes it.
#
# THE VERSION TAG IS THE ONLY COORDINATE NOW. The `:$QITS_CI_SHA` push that used to ride the
# per-push pipeline is retired with per-push CI itself (the QA pipeline builds the fold and
# publishes no image), and cd deploys a RELEASE rather than a green push - so the push below tags
# `$version`, the CalVer name the release was made under, which is what `artifacts:` declares and
# what every consumer of the resulting `SoftwareRelease` asks for.
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything, so it
# cannot see what the step below pushed; it announces `{repository, version, packageType,
# packageName}` on the strength of these two lines. Keep them true.
#
# THE NAME IS UNQUALIFIED ON PURPOSE. No registry-qualified docker reference is portable here — the
# registry is one service under several addresses ($QITS_BUILD_REGISTRY as the platform builder
# resolves it, $QITS_REGISTRY as the host daemon and qits-cd do, `registry.dev.localhost:8080` at
# the edge) — and an OCI reference cannot carry a path prefix. So the declaration carries
# `qits/<application>` and the reader supplies its own host, exactly as the push below composes one
# from environment.
#
# THE BUILD BELOW IS THE QA PIPELINE'S, AND THE TWO MUST STAY MATCHED — byte for byte in every
# buildctl argument. ci-event-release-request.yml builds the same image content at the fold and
# exports it nowhere, so a fix to one build belongs in the other; and because the platform builder's
# cache is shared, a matched build is what makes a release that follows a green fold a stack of
# cache hits rather than a second native compile. That file inherited ci-event-build.yml's step when
# per-push CI was retired, and it is where the two halves, the submodule fetch, the lockfile origin
# swap and the `npm_config_*` environment are explained at length; this one carries the short form
# and points there rather than keeping a second copy of the reasoning to drift.
#
# THE BUILD RUNS ON THE PLATFORM'S OWN BUILDKITD, NOT THE HOST DAEMON. qits-buildkit-plan.md in the
# wrapper is the migration and qits-workspace-daemon's pipeline pair is the reference recipe;
# `build: true` below is the declaration that gets this step $BUILDKIT_HOST, $QITS_BUILD_REGISTRY
# and the run's commissioned credential, and gets it NO docker socket.
#
# ONE THING NO SIBLING'S RELEASE PIPELINE HAS TO THINK ABOUT: this repo IS the registry it publishes
# to. Half one installs from the currently deployed qits-platform-artifacts while the new image is
# still being built, and half two pushes to it. Nothing bootstraps from the artifact it produces —
# but a run here cannot be green while qits-platform-artifacts is down, and this repository's
# deploys blink the git host and both registries. It is deployed alone, with nothing else in the
# queue, and a release of it deserves the same quiet.
#
# THIS FILE IS INERT UNTIL qits-workspaces PUBLISHES SCMRelease, and it lands first on purpose: the
# bus is at-most-once with no catch-up and no replay, so a trigger file must be in place before the
# event it selects exists. The other order loses a release and looks like a train that quietly did
# not roll.
event: SCMRelease
when:
  - repository: { exact: qits-artifacts-service }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: docker, name: qits/qits-artifacts }
steps:
    # node-docker-base, the image the QA pipeline already uses: node, npm and git for half one,
    # buildctl for half two — and node is also what reads the event payload, which is JSON.
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed buildctl call is
      # swallowed and the run reports SUCCESS — and a green release run is what makes qits-ci
      # announce the artifact, so it has to mean the image really was built and pushed. -u makes an
      # unset injected variable stop the step rather than compose a ref out of empty strings.
      set -eu

      # The builder, demanded loudly before anything is built. Unset means a qits-ci/qits-containers
      # pair too old to inject it; EMPTY means the kill switch (qits.ci.buildkit.enabled=false spells
      # off as empty-never-absent). Either way this recipe must fail here, naming the cause, rather
      # than fall back to a socket this step no longer holds — a silent fallback is exactly what the
      # migration exists to remove.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(node -p 'JSON.parse(process.env.QITS_EVENT_PAYLOAD).version')
      # The version reaches a `sed` s### expression below, and `#` is that expression's own
      # delimiter — a version carrying one closes it, and GNU sed's `e` command then runs a shell.
      # Refused rather than quoted: a version here is a calver or a semver, and nothing legitimate
      # needs a character outside this set. The existence check further down happens to reject a `#`
      # too (curl truncates a url at a fragment), but that is an accident of curl, not a guard.
      case "$version" in
        ''|*[!0-9A-Za-z._+-]*) echo "refusing an implausible version: $version" >&2; exit 1 ;;
      esac
      echo "releasing qits/qits-artifacts:$version"

      # THE TAG IS THE CHECKOUT TARGET, and it is the only reason this run needs one. An
      # event-triggered run is cloned at the head of main, which is where the release commit is
      # *now* — a later push moves that, and the tag does not, so a busy main cannot make this
      # pipeline ship a different tree than the one that was released. The clone is shallow and
      # carries no tags, hence the explicit refspec; the URL rather than `origin` because every
      # address a step needs arrives as environment. `checkout --detach` peels the annotated tag to
      # its commit — and it is what makes the submodule fetch below land on the gitlink the release
      # recorded rather than on main's.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- half one: the bundle -----------------------------------------------------------------
      # The daemon's clone is shallow and does not recurse, so the webui submodule arrives
      # as an empty directory and Quinoa fails the image build on it. See ci-event-release-request.yml for
      # why the lockfile origins are rewritten and why the registry is passed as environment rather
      # than as a file — that repo's committed .npmrc outranks any ~/.npmrc this step could write.
      # The repository is qits-artifacts-frontend, and the -c override key below is the .gitmodules
      # ENTRY name — the same name since the phase-2 rename moved both together.
      frontend_url="${QITS_CI_REPOSITORY_URL%/*}/qits-artifacts-frontend"
      git -c submodule.qits-artifacts-frontend.url="$frontend_url" submodule update --init service/src/main/webui

      cd service/src/main/webui
      # TWO SERVICES since the byte-plane split, so the swap reads the PATH: an entry under the
      # hosted registry's own pathname ($QITS_NPM_REGISTRY_URL's, /artifacts/npm/npm/) gets the
      # hosted origin and everything else gets the proxy's, and the broad expression has to run
      # before the narrow one. ci-event-release-request.yml carries the full reasoning.
      npm_hosted_origin=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).origin')
      npm_proxy_origin=$(node -p 'new URL(process.env.QITS_NPM_PROXY_URL).origin')
      npm_hosted_path=$(node -p 'new URL(process.env.QITS_NPM_REGISTRY_URL).pathname')
      sed -i -E \
        -e "s#(\"resolved\": \")https?://[^/\"]+#\1$npm_proxy_origin#" \
        -e "s#(\"resolved\": \")https?://[^/\"]+($npm_hosted_path)#\1$npm_hosted_origin\2#" \
        package-lock.json

      env npm_config_registry="$QITS_NPM_PROXY_URL" \
          "npm_config_@qits:registry=$QITS_NPM_REGISTRY_URL" \
          npm ci --no-audit --no-fund

      npm run build
      cd -

      # --- half two: the image ------------------------------------------------------------------
      # THE CREDENTIAL IS A SECRET MOUNT AND NEVER A BUILD ARG — an arg is recorded in the image
      # history, and this image is pullable. The launcher injects the run's commissioned idp client
      # as $QITS_COMMISSIONED_CLIENT_ID/$QITS_COMMISSIONED_CLIENT_SECRET; it is written to files
      # under umask 077 outside the clone (so neither can enter the build context) and handed to
      # buildctl as `src=`, which the Dockerfile's mvnw RUN mounts as bare files under /run/secrets.
      # FILE form on both sides, never the `env=` mount form — that one couples the recipe to
      # whichever dockerfile frontend the builder picks, and under the platform buildkitd the
      # frontend is the builder's choice, not this repository's.
      umask 077
      printf '%s' "$QITS_COMMISSIONED_CLIENT_ID" > /tmp/qits-client-id
      printf '%s' "$QITS_COMMISSIONED_CLIENT_SECRET" > /tmp/qits-client-secret

      # NO --network host, AND NOTHING REPLACES IT. Every `RUN` executes in the platform builder's
      # own namespace on qits-net, so what a build dials, it dials by IN-NETWORK address:
      # $QITS_MAVEN_REGISTRY_URL for the platform's Maven repository (where qits-auth-core lives) and
      # $QITS_MAVEN_PROXY_URL for the Central mirror, in place of the host-published and edge-vhost
      # spellings the old host networking reached. An empty mirror value — mirror plane off, or an
      # older qits-ci — deactivates the settings profile and Central is resolved directly, as it
      # always did. The Dockerfile's FROM lines keep their committed edge-vhost spellings: the
      # builder's own registry config rewrites them to the platform aliases.
      #
      # `push=true` IS THE PUBLISH: the image goes from the builder straight to the registry and
      # never enters any local image store — which is why there is no `docker rmi` question left at
      # all, and why the old note about a concurrent-build rmi race described a store this pipeline
      # no longer touches. $QITS_BUILD_REGISTRY is the registry as the BUILDER resolves it;
      # $QITS_REGISTRY stays the host daemon's view and is not dialled here.
      #
      # ci-event-release-request.yml carries these same build-args and secrets; keep them matched.
      ref="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/qits-artifacts:$version"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"

      # --- the SBOM -----------------------------------------------------------------------------
      # THE DOCUMENT GOES UP AFTER THE PUSH AND BEFORE THIS STEP EXITS GREEN. qits-ci announces
      # `SoftwareRelease` only for a green run, so ordering is the whole guarantee: no consumer is
      # ever told about a version whose bill of materials is missing. A failed PUT fails the
      # release ON PURPOSE — the store being down is not a reason to announce a version nobody can
      # audit. Only THIS pipeline uploads one: the QA pipeline builds an image it never pushes and
      # announces no release, so it owes no document.
      #
      # The second `buildctl build` reaches the Dockerfile's `sbom` stage — a `FROM scratch` holding
      # only the service module's CycloneDX document, exported with `type=local` instead of pushed.
      # Build-args and secrets are BYTE-IDENTICAL to the image build above, which is what makes every
      # layer a cache hit in the same builder and this export seconds rather than a second native
      # compile; a drift between the two invocations costs a full rebuild, not a wrong document.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=.sbom
      # The SBOM store is a sibling path of the npm registry inside this very deployment, so its
      # root is DERIVED from $QITS_NPM_REGISTRY_URL — the qits-net alias a STEP container can
      # reach. NOT from $QITS_REGISTRY: that is the host daemon's view of the registry, and inside
      # this container it answered curl with an instant connection refusal (measured on the 2026.902
      # heal release — the pushes succeeded through the daemon while the same host name was
      # unreachable from in here). It is not $QITS_BUILD_REGISTRY either: that one is the address
      # the BUILDER resolves, and this PUT is made by this step, not by the build. The path names
      # the DECLARED
      # artifact identity verbatim: `artifacts:` above says `{type: docker, name:
      # qits/qits-artifacts}`, and (packageType, packageName, version) is how the SoftwareRelease
      # consumer will ask for it.
      sbom_base="${QITS_NPM_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @.sbom/sbom.json \
        "$sbom_base/docker/qits/qits-artifacts/-/$version"
