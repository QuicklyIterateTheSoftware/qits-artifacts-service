# The gc module's own test suite: REAL postgres, no docker, no variant flag — the shape the
# `artifacts` module's suite uses, and a copy of it for the same reason GcFixture is a copy of
# ArtifactsTestSupport: modules here share no test classpath.
#
# Its own database, not `artifacts_test`: two modules' suites can run in one build, and they must not
# wipe each other's rows. testdb/EmbeddedPgConfigSource names it and supplies the url at ordinal 500,
# overriding the unresolvable QITS_RESOURCE_DB_* expressions the artifacts jar ships.
quarkus.flyway.artifacts.clean-at-start=true

# NO DEV SERVICES: a postgres datasource with no url is what invites a container start, and the
# config source always gives this one a url.
quarkus.devservices.enabled=false

# Small chunks, so the fixture's kilobyte blobs cross chunk boundaries. See the artifacts module's
# copy for why this exercises the 1 MiB default.
qits.artifacts.blob-chunk-size=4096

# Port 8081 is the platform's own npm registry on the build hosts, so never bind a fixed test port —
# a @QuarkusTest that tried would fail with "Port already bound: 8081" against a service that has
# nothing to do with this build. The qits-registries and qits-platform-mirror suites carry the same
# line for the same reason.
quarkus.http.test-port=0

# None of the six pin peers exists in this repo, and the suite has no network. Closed ports are the
# honest posture rather than hostnames that cost a DNS timeout: a pin fetch is refused at once, so a
# plan reports itself non-executable and a sweep aborts whole — the behaviour GcPinsTest asserts.
# Strategy-level cases hand a GcPins in directly and never reach these.
qits.artifacts.gc.pins.cd-base-url=http://localhost:1/deployments/api
qits.artifacts.gc.pins.ci-base-url=http://localhost:1/ci/api
qits.artifacts.gc.pins.maintenance-base-url=http://localhost:1/maintenance/api
qits.artifacts.gc.pins.configuration-base-url=http://localhost:1/configuration/api
qits.artifacts.gc.pins.workspaces-base-url=http://localhost:1/workspaces/api
qits.artifacts.gc.pins.projects-base-url=http://localhost:1/projects/api

# The cache profiles ride in on the qits-registries jars whether this module wants them or not, and a
# registered profile is a type the planner reports on. This service registers only what it hosts, so
# the suite has to say what the deployable's application.properties says — otherwise the plan grows
# three lines for types whose engine and configuration are qits-platform-mirror's.
quarkus.arc.exclude-types=eu.wohlben.qits.artifacts.control.NpmProxyProfile,eu.wohlben.qits.artifacts.control.MavenProxyProfile,eu.wohlben.qits.artifacts.control.OciMirrorProfile
