components:
  schemas:
    DocsSiteCatalog:
      type: object
      required:
      - sites
      properties:
        sites:
          type: array
          items:
            $ref: "#/components/schemas/DocsCatalogEntry"
    DocsCatalogEntry:
      type: object
      required:
      - name
