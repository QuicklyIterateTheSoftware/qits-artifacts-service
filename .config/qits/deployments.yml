# WHAT THIS REPOSITORY DEPLOYS AS, held still across the repository rename. The repository is
# qits-artifacts-service now; the application is still qits-artifacts, so nothing that is running
# moves: the swarm service and its wire alias, the container, the image qits/qits-artifacts the
# build pushes, the provisioned database, the derived host label, the extras family and the
# QITS_APPLICATION the container boots with all keep the names they have. Omitted, this name would
# be DERIVED from the repository, and the rename would read as a decommission plus a new application
# rather than a rename. Changing the value later is exactly that decommission, so it does not change
# again.
application: qits-artifacts

# The machine surfaces. The edge path-routes both prefixes on every host, so a build reaches
# /artifacts/npm and a docker client reaches /v2 wherever it asks. The browser surface is what this
# service's own host serves at its root and needs no route entry.
routes: /artifacts,/v2

# The DNS label of that host. Explicit because the derived one would be `artifacts` (the application
# name minus its qits- prefix), and `registry.<env>.<domain>` is the name docker already resolves
# every image reference against — one public name for the plane rather than two for one service.
host: registry

# Where this application hangs in the sidebar: under the four kinds of repository that publish
# bytes here. A frontend or a CLI publishes documentation and runs CI, but nothing of its own lands
# in this store, so those two slots are deliberately empty. The position is per slot: 6 is
# Artifacts' place in the platform's fixed order of the per-repository applications
# (Api Docs 1, Docs 2, Release Requests 3, Code 4, CI 5, Artifacts 6, Configuration 7, Workspaces 8).
#
# ARTIFACTS MOVED 5 -> 6 ON 2026-09-01, and nothing about this application changed. qits-projects put
# a Release Requests row at position 3, above Code, and every entry from Code down moved up one in
# the same change — this file, qits-githost, qits-ci, qits-configuration and qits-workspaces, one
# line each. Only the four slots this file declares are renumbered: the two it leaves empty stay
# empty, because a position is per slot and an absent entry has none. The order is stated in
# integers rather than left to the edge's position-then-label tie-break so that renaming a row
# cannot silently reorder the group.
navigation-entries: services.details.Artifacts:6, daemons.details.Artifacts:6, libs.details.Artifacts:6, apps.details.Artifacts:6, images.details.Artifacts:6

# A postgres role and database of this application's own (qits_artifacts by derivation), created
# on the tier's postgres BEFORE the successor starts and injected as QITS_RESOURCE_DB_URL /
# _USERNAME / _PASSWORD. Declared AHEAD of the PostgreSQL cutover on purpose: the running H2
# image ignores the injected triple, so the next deploy provisions the role and database while
# nothing depends on them yet, and cutover day starts with credentials that already exist
# (qits-artifacts-postgresql-plan.md §9.1).
resources: postgresql:db

# The convention would derive the health path from the repository name, but the route path
# deliberately did not move with the rename — the service still serves /artifacts. Without this line
# the deployer probes a 404 and rolls every deployment back as unhealthy.
health_path: /artifacts/q/health/ready

# STOP-FIRST, because this deployment publishes a host port. Under start-first the successor
# waits in Pending for a port the predecessor only frees by stopping — which start-first never
# does — so a one-node swarm deadlocks on the first rolling update. A single binder cannot have
# the lossless-rollback overlap; the deploy takes the brief gap instead. Measured live on
# qits-platform-mirror's 2026.813.163303 deploy, the first host-port update since the swarm
# cutover (2026-08-13).
update_order: stop-first

# Where the browsable API document lives: swagger-ui under this service's non-application
# root, which sits under the primary route above. The shell's Api Docs viewer reads it off
# /main-navigation and frames it for this repository.
api-docs: /artifacts/q/swagger-ui
