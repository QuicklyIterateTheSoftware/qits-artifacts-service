# The JSON doors of the Vert.x wires that other qits repositories call (qits-1149).
#
# These routes are Vert.x, not JAX-RS, so no annotation can describe them. SmallRye merges this file
# into the served document at /artifacts/q/openapi. It names each door a consumer's pact cites, so
# the golden masters and the pacts share one operationId per door.
#
# The registry protocols (/v2, /artifacts/npm, /artifacts/maven) are named here too, but only the
# doors another qits repository calls: qits-ci's presence and pin probes, qits-maintenance's
# version listings, the qits CLI's and the bootstrap's publishes and probes. Their full grammar is
# the protocol's own (OCI distribution, the npm registry API, the maven repository layout), and the
# docker, npm and maven clients that speak it are not qits callers.
#
# A {site}, {packageName}, {name} or {path} may hold slashes (@changelog/<repository>, @scope/name,
# qits/<image>, a maven group path), which an OpenAPI path parameter cannot express; the routes
# accept them all the same.
openapi: 3.1.0
paths:
  /artifacts/docs/{repository}:
    get:
      operationId: listDocsSites
      summary: Every docs site in the repository, with its version count and latest version.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The catalog, {sites:[{name, versionCount, latestVersion, latestPublishedAt}]}." }
  /artifacts/docs/{repository}/{site}:
    get:
      operationId: listDocsVersions
      summary: The versions of one docs site, newest first. meta.<key>=<value> query parameters filter by metadata.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: site, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{name, versions:[{name, version, fileCount, totalBytes, publishedAt, metadata?}]}; an empty list when a filter matches nothing." }
        "404": { description: "No such site." }
  /artifacts/docs/{repository}/{site}/-/{version}:
    get:
      operationId: getDocsVersion
      summary: One version of a docs site, with the paths of its files.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: site, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{name, version, fileCount, totalBytes, publishedAt, metadata?, files:[path]}." }
        "404": { description: "No such version." }
    put:
      operationId: putDocs
      summary: Publishes one version of a docs site from a .tar.gz bundle. X-Artifacts-Meta-<key> headers set its metadata.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: site, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/gzip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: "The receipt, {name, version, fileCount, totalBytes, publishedAt, metadata?}." }
        "409": { description: "The version exists; versions are immutable." }
  /artifacts/docs/{repository}/{site}/-/{version}/{path}:
    get:
      operationId: getDocsFile
      summary: One file of a docs version, as stored, with its media type and ETag.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: site, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The file's bytes." }
        "404": { description: "No such file." }
  /artifacts/sboms/{packageType}/{packageName}/-/{version}:
    get:
      operationId: getSbom
      summary: The CycloneDX document published for one release, byte for byte.
      parameters:
        - { name: packageType, in: path, required: true, schema: { type: string } }
        - { name: packageName, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The document, application/vnd.cyclonedx+json." }
        "404": { description: "No document for the release." }
    head:
      operationId: headSbom
      summary: Whether a document is published for one release; its digest in Docker-Content-Digest.
      parameters:
        - { name: packageType, in: path, required: true, schema: { type: string } }
        - { name: packageName, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Published." }
        "404": { description: "Not published." }
    put:
      operationId: putSbom
      summary: Publishes the CycloneDX document of one release. First write wins.
      parameters:
        - { name: packageType, in: path, required: true, schema: { type: string } }
        - { name: packageName, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/vnd.cyclonedx+json: { schema: { type: object } }
      responses:
        "201": { description: "The receipt, {packageType, packageName, version, digest, sizeBytes, specVersion, createdAt}." }
        "200": { description: "A document was already published; the receipt of the stored one, with alreadyPublished: true." }
  /artifacts/daemons/{daemon}/{version}:
    get:
      operationId: getDaemon
      summary: One daemon version's bytes, application/octet-stream.
      parameters:
        - { name: daemon, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The binary." }
        "404": { description: "Not published." }
    head:
      operationId: headDaemon
      summary: Whether one daemon version is published; its digest in Docker-Content-Digest and ETag.
      parameters:
        - { name: daemon, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Published." }
        "404": { description: "Not published." }
    put:
      operationId: putDaemon
      summary: Publishes one daemon binary version.
      parameters:
        - { name: daemon, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201": { description: "The receipt, {name, version, digest, sizeBytes, publishedAt}." }
        "409": { description: "The version exists; versions are immutable." }
  /artifacts/content-hashes/{type}/{name}/-/{version}:
    get:
      operationId: getContentHash
      summary: The content hash recorded for one version of a maven or npm package.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [maven, npm] } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ecosystem, name, version, contentHash}; contentHash is null when none was recorded." }
        "404": { description: "No such version." }
  /artifacts/content-hashes/{type}/{name}/-/newest:
    get:
      operationId: getNewestContentHash
      summary: The newest version of a maven or npm package, by version order, and its content hash.
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [maven, npm] } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ecosystem, name, version, contentHash}." }
        "404": { description: "No version of the package exists." }
  /artifacts/maven/{repository}/{groupPath}/{artifact}/maven-metadata.xml:
    get:
      operationId: getMavenMetadata
      summary: The maven-metadata.xml derived from the versions deployed under one groupId/artifactId.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: groupPath, in: path, required: true, schema: { type: string } }
        - { name: artifact, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The document, application/xml; versioning.versions lists every deployed version." }
        "404": { description: "Nothing is deployed under the artifact." }
  /artifacts/maven/{repository}/{groupPath}/{artifact}/{version}/{file}:
    get:
      operationId: getMavenFile
      summary: One deployed file of a maven version (a pom, a jar), as stored.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: groupPath, in: path, required: true, schema: { type: string } }
        - { name: artifact, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The file's bytes." }
        "404": { description: "Not deployed." }
    put:
      operationId: putMavenFile
      summary: Deploys one file of a maven version. X-Artifacts-Content-Hash on the pom records the version's content hash.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: groupPath, in: path, required: true, schema: { type: string } }
        - { name: artifact, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          "*/*": { schema: { type: string, format: binary } }
      responses:
        "201": { description: "Deployed, or the same bytes were already deployed." }
        "403": { description: "Different bytes are already deployed at the path; releases are immutable." }
  /artifacts/npm/{repository}/{package}:
    get:
      operationId: getNpmPackument
      summary: The packument of one package, with every version's manifest under versions and the dist-tags.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: package, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{_id, name, dist-tags, versions:{<version>:{name, version, dist}}, time}." }
        "404": { description: "No such package." }
    put:
      operationId: putNpmPackage
      summary: Publishes one version of a package, as npm publish sends it (the tarball base64 under _attachments).
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: package, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        "201": { description: "Published." }
        "403": { description: "The version exists; versions are immutable." }
  /artifacts/npm/{repository}/{package}/-/{tarball}:
    head:
      operationId: headNpmTarball
      summary: Whether one version's tarball is published.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: package, in: path, required: true, schema: { type: string } }
        - { name: tarball, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Published." }
        "404": { description: "Not published." }
  /artifacts/npm/{repository}/-/package/{package}/dist-tags/{tag}:
    put:
      operationId: putNpmDistTag
      summary: Points one dist-tag of a package at a published version; the body is the version as a JSON string.
      parameters:
        - { name: repository, in: path, required: true, schema: { type: string } }
        - { name: package, in: path, required: true, schema: { type: string } }
        - { name: tag, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: string } }
      responses:
        "200": { description: "The tag moved." }
        "404": { description: "No such package or version." }
  /v2/{name}/manifests/{reference}:
    get:
      operationId: getImageManifest
      summary: The manifest an image tag or digest names, in the media type it was pushed with.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The manifest; its digest in Docker-Content-Digest." }
        "404": { description: "MANIFEST_UNKNOWN or NAME_UNKNOWN." }
    head:
      operationId: headImageManifest
      summary: Whether an image tag or digest resolves; its digest in Docker-Content-Digest.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: reference, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Resolves." }
        "404": { description: "MANIFEST_UNKNOWN or NAME_UNKNOWN." }
  /v2/{name}/tags/list:
    get:
      operationId: listImageTags
      summary: The tags of one image, paged by n and last.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: "n", in: query, schema: { type: integer } }
        - { name: last, in: query, schema: { type: string } }
      responses:
        "200": { description: "{name, tags:[tag]}; an empty list for a name nothing was pushed under." }
