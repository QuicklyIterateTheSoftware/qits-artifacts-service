archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-artifacts, sbom: .sbom/sbom.json }
userflows: qits-artifacts

# THE VERIFY HERE RUNS WITH QUINOA ON, which is the opposite of every sibling and of the recipe.
# The stories exercise the served SPA, so the client is built inside this step —
# `package-manager-install` plus a pinned node version, and `quinoa.ci` — and `-Dquarkus.quinoa=false`
# would take the thing under test away. The step also runs on `userflows-base` as `pwuser` rather
# than on `maven-base` as `build`, and wants 3600s rather than 2400. Four reasons, one slot.
release-request:
  - image: qits/build-images/node-docker-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      webui_dirs=""
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
          if [ -f "$path/package.json" ]; then
            webui_dirs="$webui_dirs $path"
          fi
        done
      fi
      # THE ADDRESSES ARE CODE (qits-731): the platform's public domain is the one input, and the
      # hosts and paths below are constants — registry.qits.<domain> serves the hosted @qits scope,
      # mirror.qits.<domain> the npmjs cache. `wohlben.eu` covers a qits-ci too old to inject
      # $QITS_DOMAIN, which is what runs this file while the qits-ci that does is being released.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
      for dir in $webui_dirs; do
        (
          cd "$dir"
          # The lockfile is installed exactly as committed, no rewrite: it names only the two
          # public hosts (qits-731), and `npm ci` is pointed at them directly.
          env npm_config_registry="$npm_proxy_origin/npm/npmjs/" \
              "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
              npm ci --no-audit --no-fund
          npm run build
        )
      done
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --opt build-arg:QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret

  # `user: pwuser` and NOT a switch inside the script: a step container starts --cap-drop=ALL, so
  # `su` cannot switch user at all. userflows-base carries a passwd-backed non-root user.
  #
  # THE SUBMODULE IS THIS STEP'S OWN BUSINESS TOO. A step shares no working directory with any
  # other — each is an ephemeral container with its own clone — and the daemon's clone does not
  # recurse, so without the walk below Quinoa finds an EMPTY webui directory, which is the one
  # state it calls a misconfiguration rather than "no client".
  - image: qits/build-images/userflows-base:latest
    user: pwuser
    timeout-seconds: 3600
    script: |
      origin_parent="${QITS_CI_REPOSITORY_URL%/*}"
      # THE ADDRESSES ARE CODE (qits-731): the platform's public domain is the one input, and the
      # hosts and paths below are constants. `wohlben.eu` covers a qits-ci too old to inject
      # $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      npm_hosted_origin="https://registry.qits.$qits_domain"
      npm_proxy_origin="https://mirror.qits.$qits_domain"
      npm_hosted_path=/artifacts/npm/npm/
      if [ -f .gitmodules ]; then
        for key in $(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$'); do
          name=${key#submodule.}
          name=${name%.path}
          path=$(git config -f .gitmodules --get "$key")
          git -c "submodule.$name.url=$origin_parent/$name" submodule update --init "$path"
        done
      fi
      # The lockfile is installed exactly as committed, no rewrite: it names only the two public
      # hosts (qits-731).
      export npm_config_registry="$npm_proxy_origin/npm/npmjs/"
      # The platform registry: the poms' default names a host-published address unreachable from a
      # step container, and the exact-id mirror in .qits-maven-settings.xml is what passes Maven's
      # HTTP blocker. Central rides the mirror. Both are code under the platform's public domain
      # (qits-731); `wohlben.eu` covers a qits-ci too old to inject $QITS_DOMAIN.
      export QITS_MAVEN_REPOSITORY_URL="https://registry.qits.$qits_domain/artifacts/maven/maven"
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      env "npm_config_@qits:registry=$npm_hosted_origin$npm_hosted_path" \
        ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL" \
        -Dquarkus.quinoa.package-manager-install=true \
        -Dquarkus.quinoa.package-manager-install.node-version=22.22.0 \
        -Dquarkus.quinoa.ci=true
      tar -czf /tmp/userstories.tgz -C service/target/userstories .
      # Only a CI run may publish, so this PUT carries the run's own bearer. Minted HERE rather
      # than read from QITS_PUBLISH_TOKEN, because the verify above can run for most of an hour
      # and a token minted at container start would be expired by the time it is spent.
      #
      # Absent, unusable or failing, the header is simply left off and the PUT goes out bare —
      # which is what it does today. That is deliberate: this recipe lands before qits-artifacts
      # starts refusing an anonymous publish, and it must not break the release in between.
      publish_token=""
      if [ -n "${QITS_PUBLISH_TOKEN_COMMAND:-}" ] \
        && command -v "$QITS_PUBLISH_TOKEN_COMMAND" >/dev/null 2>&1; then
        publish_token=$("$QITS_PUBLISH_TOKEN_COMMAND" 2>/dev/null) || publish_token=""
      fi
      # THE ARGUMENT LIST, not an unquoted `${publish_token:+-H "Authorization: …"}`: that value
      # contains spaces and would word-split into four arguments, of which curl would read the
      # first as the whole header. An empty `"$@"` expands to nothing in both dash and bash.
      set --
      if [ -n "$publish_token" ]; then
        set -- -H "Authorization: Bearer $publish_token"
      fi
      status=$(curl -sS -o /tmp/docs-publish.out -w '%{http_code}' \
        -X PUT --data-binary @/tmp/userstories.tgz "$@" \
        -H "X-Artifacts-Meta-git.branch.name: $QITS_CI_BRANCH" \
        -H "X-Artifacts-Meta-git.commit.hash: $QITS_CI_SHA" \
        -H "X-Artifacts-Meta-git.repository.name: qits-artifacts" \
        "https://registry.qits.$qits_domain/artifacts/docs/docs/@userflows/qits-artifacts/-/$QITS_CI_SHA")
      case "$status" in
        201) echo "published userflows for qits-artifacts@$QITS_CI_SHA ($QITS_CI_BRANCH)" ;;
        409) echo "userflows for qits-artifacts@$QITS_CI_SHA are already published — skipping" ;;
        *)   echo "docs publish failed: HTTP $status"; cat /tmp/docs-publish.out; exit 1 ;;
      esac
