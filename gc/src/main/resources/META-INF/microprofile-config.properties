# The gc module's own defaults, shipped in its jar beside the code that reads them.
#
# Only keys this module reads live here. `qits.artifacts.gc.blob-grace-period` stays in the
# artifacts jar, because BlobStore reads it and the store is where the window is enforced.
#
# The type -> (strategy, window) mapping is the user's settlement of 2026-08-05
# (artifacts-gc-plan.md, "Settlement"): configured per type. A deployment overrides any line below
# with an environment variable — QITS_ARTIFACTS_GC_TYPE_OCI_IMAGES_WINDOW and kin — and needs no code
# change, which is what "changeable anytime" meant.
#
# Every REGISTERED repository type must appear here. A type with no entry is refused rather than
# defaulted (GcTypeConfig.of), because a type nobody configured is a decision nobody took. The three
# cache types are absent because their profiles are not registered in this service and their engine
# is not on this classpath: they are qits-platform-mirror's, and their lines went with them.

# The six pin sources, read once at the start of every plan and every sweep and never cached.
# RENAMED from qits.artifacts.gc.oci.cd-* : pins are no longer one type's business, they are the
# run's — an unreachable source aborts the whole sweep with nothing deleted, and a dry-run reports
# itself non-executable rather than failing one type. A deployment carrying the old spelling silently
# loses the value, so check the env when upgrading.
#
# All six are plain HTTP GETs on qits-net, where callers are trusted, and all default to the service's
# network alias so a deployment needs no env of its own. A wrong value here reclaims nothing rather
# than deleting something live. Tests point them at a closed port, which is exactly that posture.
# The `cd-` half of the key name is history: qits-cd and qits-serviceregistry merged back into
# qits-platform-deployments, which owns the rollback rule and answers the same
# {"pins":[{"applicationName","shas"}]} at its own segment. The KEY was left alone deliberately —
# renaming it is the one change that loses a deployment's override silently, and no deployment sets
# it. The VALUE had to move: /cd/api/pins resolves nowhere now.
qits.artifacts.gc.pins.cd-base-url=http://qits-platform-deployments:8080/platform-deployments/api
qits.artifacts.gc.pins.cd-timeout=PT10S
qits.artifacts.gc.pins.ci-base-url=http://qits-ci:8080/ci/api
qits.artifacts.gc.pins.ci-timeout=PT10S
# The two CONSUMPTION sources, added 2026-09-04 with the P3D windows below and load-bearing for
# them. qits-platform-maintenance answers which internal maven/npm/docker versions repositories'
# manifests still reference on main; qits-configuration answers which container images the platform
# is configured to launch — the workspace, editor and agent images no deployment row names because
# nothing has started them yet. Both fail the run closed exactly as the two above do.
qits.artifacts.gc.pins.maintenance-base-url=http://qits-platform-maintenance:8080/maintenance/api
qits.artifacts.gc.pins.maintenance-timeout=PT10S
qits.artifacts.gc.pins.configuration-base-url=http://qits-configuration:8080/configuration/api
qits.artifacts.gc.pins.configuration-timeout=PT10S
# The two EFFECTIVE sources, added 2026-09-05, and they close the residual the fourth one left. The
# configured version is what the NEXT deploy of a launching service will be handed; the service
# running right now still launches whatever it was deployed with, and for as long as that gap lasts
# the coordinate every workspace start actually pulls is named by nothing. So the consumer that
# pulls answers for itself: qits-workspaces for the workspace and editor images, qits-projects for
# the agent and refinement ones. Both fail the run closed exactly as the four above do.
qits.artifacts.gc.pins.workspaces-base-url=http://qits-workspaces:8080/workspaces/api
qits.artifacts.gc.pins.workspaces-timeout=PT10S
qits.artifacts.gc.pins.projects-base-url=http://qits-projects:8080/projects/api
qits.artifacts.gc.pins.projects-timeout=PT10S

# The platform's own artifacts: what is referenced or launchable stays, everything else goes.
#
# ALL SIX WINDOWS ARE P0D since 2026-09-05, down from P3D and before that from P30D/P90D. Zero is
# not "collect aggressively", it is the statement that RETENTION IS THE KEEP-SET: an identity lives
# because something names it — a pin source, a belt — and not because somebody pulled it recently.
# The window was the last place where "in use" was INFERRED from a timestamp, and a timestamp is the
# one input here that nobody owns: a container running untouched for months pulls its sha on
# restart, and a library nothing has resolved this week is still what every build of its consumer
# needs. Age answered neither of those; the keep-classes answer both by name.
#
# What carries the store at zero, in full: the six pin sources (what is deployed, what the ci ladder
# would launch, what repositories' manifests reference on main, what the platform is configured to
# launch, and what qits-workspaces and qits-projects would each pull today), keep-last-2-releases
# per identity group — which is "keep the latest", twice over — the newest-release and `latest`
# belts on oci-images, and on maven-packages the resolvable-snapshot belt plus the rule that no
# published release is age-collected at all (MavenPackagesGcAdapter), which is why maven does not
# need the window this block is about.
#
# WHY ZERO IS SAFE, in one argument: per-push CI is retired, so nothing builds a bare branch. Every
# QA build resolves the octopus FOLD with current main, and main's manifests are exactly what the
# maintenance dependency pins name — so a branch's build resolves the keep-set by construction. The
# only branch that can miss is one hand-pinning an internal version already three releases stale,
# which fails loudly at resolve time and is re-bumped in one commit. That is the whole exposure, and
# it is cheaper than a store that grows by ~90 images a day forever.
#
# The one clock left is qits.artifacts.gc.blob-grace-period (PT6H, in the artifacts jar): race
# safety for bytes that landed before their pin did, not retention. Raising a window here is a
# decision about disk; the thing that would make it a decision about CORRECTNESS again is lowering
# the pin coverage, so a source removed is a window owed.
qits.artifacts.gc.type.oci-images.strategy=own
qits.artifacts.gc.type.oci-images.window=P0D
# NPM DOES NOT AGE-COLLECT PUBLISHED RELEASES AT ALL since 2026-09-05, so this window governs
# prereleases — the per-push -main.g<sha> builds — and nothing else. It is the maven exemption from
# that morning, ported the same evening for the same reasons and one sharper: a frontend's lockfile
# is reached through a service's SUBMODULE GITLINK, so no pin source on this platform can see an npm
# pin at all. The zero-window sweep took @qits/ui-components down to three versions and
# @qits/angular to two, broke fifteen frontend lockfiles and failed two services' release runs on
# `npm ci`. RAISING THIS NUMBER IS NOT WHAT WOULD HAVE PREVENTED THAT; not collecting releases is.
# See NpmPackagesGcAdapter.
qits.artifacts.gc.type.npm-packages.strategy=own
qits.artifacts.gc.type.npm-packages.window=P0D
# MAVEN DOES NOT AGE-COLLECT PUBLISHED RELEASES AT ALL since 2026-09-05, so for this one type the
# window below is moot where it matters: the never-collect rule is asked before it, and what is left
# for the window to govern is superseded timestamped SNAPSHOT sets and nothing else. At P0D those go
# on the run that finds them — they are build output this store regenerates, and the set a resolver
# is actually sent to is kept structurally whatever the window says.
#
# The window used to decide the fate of published jars, first at P90D and then — for one night — at
# P3D, on the argument that maintenance's dependency pins would name every internal version a
# repository still builds against. At 01:58 on 2026-09-05 it deleted 67 published eu.wohlben.qits
# coordinates and every gating build on the platform stopped resolving. The pin source is right
# about what it claims and far narrower than what a build resolves (13 coordinates named against
# hundreds held), age on a maven row measures cache warmth rather than need, and the whole hosted
# maven repository rounds to nothing beside 28.8 GB of images. LOWERING THIS NUMBER TO ZERO IS NOT
# WHAT ENDANGERS RELEASES AND RAISING IT IS NOT WHAT WOULD HAVE SAVED THEM; not collecting releases
# is. See MavenPackagesGcAdapter.
qits.artifacts.gc.type.maven-packages.strategy=own
qits.artifacts.gc.type.maven-packages.window=P0D
# The daemon carried P90D on the argument that a binary is fetched when a runner starts, and that
# cadence is not a month. That one is answered directly rather than by waiting: qits-ci's ladder
# names both daemon rungs, so the versions the long window existed for are kept by name.
qits.artifacts.gc.type.daemon-binaries.strategy=own
qits.artifacts.gc.type.daemon-binaries.window=P0D
# docs and sboms keep their belt — the last 2 versions of every site and the last 2 released
# documents of every package, regardless of age — which is what the long window was always standing
# in for. What goes at P0D is the third-oldest version of a site nobody opens: it was the
# settlement's intended collection at P30D and it is the same collection now, taken on the day the
# third version appears rather than a month later.
qits.artifacts.gc.type.docs.strategy=own
qits.artifacts.gc.type.docs.window=P0D
qits.artifacts.gc.type.sboms.strategy=own
qits.artifacts.gc.type.sboms.window=P0D

# The two CI types: no strategy configured for now, reported honestly (settlement). Their intended
# rules are written down in CiScreenshotsGcStrategy and CiVideosGcStrategy. No window, because a
# window beside a type nobody collects reads as a rule that is running.
qits.artifacts.gc.type.ci-screenshots.strategy=excluded
qits.artifacts.gc.type.ci-videos.strategy=excluded
